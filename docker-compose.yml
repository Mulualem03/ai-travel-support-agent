services:
  db:
    image: postgres:16
    container_name: travel_support_db
    environment:
      POSTGRES_USER: travel_user
      POSTGRES_PASSWORD: travel_password
      POSTGRES_DB: travel_support
    ports:
      - "5432:5432"
    volumes:
      - travel_support_postgres:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: travel_support_backend
    env_file:
      - .env
    ports:
      - "8010:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: travel_support_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  travel_support_postgres:
